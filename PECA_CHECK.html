<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061525">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PEÇA CHECK">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PEÇA CHECK</title>
<style>
:root{
  --bg:#04101e; --panel:#0a1d31; --panel2:#0d2740; --line:#087ff5;
  --blue:#1497ff; --blue2:#006fe8; --text:#f2f7ff; --muted:#91b2d5;
  --green:#21d18a; --yellow:#ffc857; --red:#ff5d6c;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 70% 20%,#103455 0,#061525 35%,#020a13 100%);
 color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px;position:relative;overflow:hidden}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;background:
 linear-gradient(135deg,transparent 72%,rgba(20,151,255,.08) 72%,transparent 73%),
 linear-gradient(315deg,transparent 78%,rgba(20,151,255,.05) 78%,transparent 79%)}
.header{padding:28px 20px 17px;border-bottom:1px solid #0d8cff;background:rgba(4,18,32,.9)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;border:3px solid var(--blue);border-radius:16px;display:grid;place-items:center;font-size:27px;font-weight:900;color:var(--blue);transform:rotate(-3deg)}
.brand h1{font-size:25px;margin:0;letter-spacing:.5px}.brand h1 span{color:var(--blue)}.brand small{display:block;color:#b9cce1;letter-spacing:2px;font-size:9px;margin-top:5px}
.gear{margin-left:auto;background:none;border:0;color:var(--blue);font-size:28px}
.page{padding:18px}
.titlebar{display:flex;align-items:center;gap:14px;margin:2px 0 16px}.back{background:none;border:0;color:var(--blue);font-size:18px}.titlebar h2{font-size:20px;letter-spacing:2px;margin:0;text-transform:uppercase}
.card{background:linear-gradient(145deg,rgba(12,39,64,.96),rgba(5,22,38,.96));border:1px solid #126fc2;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:20px;margin-bottom:14px}
.sector{font-size:13px;letter-spacing:3px;color:#9dc0e3}.sector strong{display:block;color:#fff;font-size:31px;letter-spacing:1px;margin-top:5px}
.hero{height:145px;margin:17px 0;border-radius:16px;border:1px solid #0b5d9e;overflow:hidden;position:relative;background:
 radial-gradient(circle at 75% 50%,#52799b 0 2%,transparent 3%),
 linear-gradient(135deg,#0b2238,#173d5d 48%,#081827)}
.hero:after{content:"⚙";position:absolute;right:23px;top:19px;font-size:100px;color:rgba(168,210,239,.16);transform:rotate(12deg)}
.heroText{position:absolute;left:18px;bottom:17px;z-index:2}.heroText b{display:block;color:var(--blue);font-size:18px;letter-spacing:1px}.heroText span{color:#b6cbe2;font-size:13px}
.input{width:100%;padding:17px 18px;border:1px solid #1769a9;border-radius:16px;background:#061827;color:#fff;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,151,255,.12)}.input::placeholder{color:#6685a5}
.primary{width:100%;border:1px solid #36aaff;border-radius:30px;padding:16px;margin-top:14px;background:linear-gradient(180deg,#159bff,#076bdc);color:#fff;font-weight:800;letter-spacing:1px;box-shadow:0 7px 22px rgba(0,118,232,.3)}
.menu{display:grid;gap:11px}.menu button{width:100%;text-align:left;background:linear-gradient(145deg,#0b2843,#071a2d);color:#fff;border:1px solid #086fca;border-radius:16px;padding:15px;display:flex;align-items:center;gap:14px}.ico{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#06213a;border:1px solid #087ff5;color:#14a1ff;font-size:22px}.menu b{display:block;font-size:16px}.menu small{color:#91b8dc}.arrow{margin-left:auto;color:#63b7ff;font-size:25px}
.info{padding:0}.partNo{font-size:27px;color:var(--blue);font-weight:800}.kv{display:grid;grid-template-columns:125px 1fr;border-top:1px solid #18527d;padding:9px 0;font-size:14px}.kv label{color:#8db9e3}.kv span{color:#fff}
.badge{display:inline-block;padding:5px 9px;border-radius:10px;font-size:11px;background:#073c2c;color:#5ff0b3;border:1px solid #158d64}
.list{display:grid;gap:9px}.row{background:#081c30;border:1px solid #124f7f;border-radius:13px;padding:13px}.row b{display:block}.row small{color:var(--muted)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{height:145px;border-radius:13px;border:1px solid #126bb1;background:linear-gradient(145deg,#183c59,#061827);display:grid;place-items:center;color:#7fa8ca;font-size:44px}.photo span{font-size:11px;display:block;text-align:center}
.flow{display:flex;flex-direction:column;gap:0}.step{position:relative;padding:14px 15px 14px 58px;border:1px solid #145b8e;background:#071b2e}.step:first-child{border-radius:15px 15px 0 0}.step:last-child{border-radius:0 0 15px 15px}.step:before{content:"";position:absolute;left:18px;top:18px;width:20px;height:20px;border-radius:50%;background:#0b8ef5;border:4px solid #08213a}.step:after{content:"";position:absolute;left:27px;top:42px;height:31px;border-left:2px solid #176ca7}.step:last-child:after{display:none}.step b{font-size:14px}.step small{color:#8fb3d6}
.sectionTitle{font-size:14px;color:#8db9df;letter-spacing:1px;margin:17px 0 9px}
.empty{text-align:center;color:#8aaac7;padding:30px 10px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:rgba(4,18,32,.97);border-top:1px solid #12527f;display:grid;grid-template-columns:repeat(3,1fr);z-index:10}
.bottom button{border:0;background:none;color:#86a9cb}.bottom button.active{color:#1497ff}.bottom i{font-style:normal;font-size:22px;display:block}.bottom small{font-size:11px}
.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#0d2942;border:1px solid #1689e8;padding:11px 15px;border-radius:12px;z-index:30;font-size:13px;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,5,12,.78);z-index:20;display:grid;place-items:end center}.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:#071a2c;border:1px solid #126fc2;border-radius:24px 24px 0 0;padding:20px}.close{float:right;border:0;background:none;color:#8fb6da;font-size:24px}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand"><div class="logo">✓</div><div><h1>PEÇA <span>CHECK</span></h1><small>INFORMAÇÕES • CONFORMIDADE • QUALIDADE</small></div><button class="gear" onclick="showToast('Configurações em desenvolvimento')">⚙</button></div>
</header>

<main id="content"></main>

<nav class="bottom">
 <button class="active" onclick="home()"><i>⌂</i><small>Início</small></button>
 <button onclick="historyPage()"><i>☷</i><small>Histórico</small></button>
 <button onclick="registerPage()"><i>⊕</i><small>Cadastrar</small></button>
</nav>
</div>
<div id="modal" class="hidden"></div>
<script>
const db = {
 M68444:{
  chave:"M68444",cliente:"Cliente Exemplo Ltda.",descricao:"Suporte de Fixação",
  liga:"Ferro Fundido Nodular (GGG40)",bruto:"12,650 kg",liquido:"11,230 kg",
  icfs:[["ICFI-001","Inspeção visual após rebarbação"],["ICFI-014","Controle dimensional"],["ICFI-021","Critérios de pintura"]],
  fotos:["Vista frontal","Vista traseira","Vista lateral","Detalhe da usinagem"],
  pintura:[["Sistema","Primer epóxi + acabamento"],["Preparação","Jateamento abrasivo"],["Camada úmida","Conforme especificação da tinta"],["Camada seca","Conforme desenho/especificação"],["Cor","Conforme padrão do cliente"]],
  fluxo:["Recebimento da peça","Rebarbação","Esmerilhamento","Inspeção visual","Jateamento","Pintura","Inspeção final","Expedição"],
  elevacao:[["Rebarbação","Gancho de elevação","Conforme capacidade indicada"],["Movimentação","Linga de corrente Grau 10","CMU conforme configuração"],["Jateamento","Cinta de elevação","Verificar capacidade e proteção"],["Pintura","Gancho de elevação","Verificar fixação antes do içamento"]]
 }
};
let current=null;
function shell(title,back=true){return `<div class="page"><div class="titlebar">${back?'<button class="back" onclick="goBack()">‹ Voltar</button>':''}<h2>${title}</h2></div>`}
function home(){
 document.getElementById("content").innerHTML=`<div class="page">
 <div class="card">
  <div class="sector">SETOR DE</div><div class="sector"><strong>ACABAMENTO</strong></div>
  <div class="hero"><div class="heroText"><b>PEÇA DESEJADA</b><span>Digite o número chave da peça para consultar as informações.</span></div></div>
  <input id="key" class="input" placeholder="Número chave da peça" autocomplete="off" onkeydown="if(event.key==='Enter')consult()">
  <button class="primary" onclick="consult()">⌕ &nbsp; CONSULTAR</button>
 </div>
 </div>`;
 current=null;
}
function consult(){
 const k=document.getElementById("key").value.trim().toUpperCase();
 if(!k){showToast("Digite o número chave da peça.");return}
 if(!db[k]){showToast("Peça não encontrada no cadastro.");return}
 current=db[k];partPage();
}
function partPage(){
 const p=current;
 document.getElementById("content").innerHTML=shell("Informações da peça")+`
 <div class="card info">
  <div class="sector">Nº CHAVE</div><div class="partNo">${p.chave}</div>
  <div class="kv"><label>Cliente:</label><span>${p.cliente}</span></div>
  <div class="kv"><label>Descrição:</label><span>${p.descricao}</span></div>
  <div class="kv"><label>Liga Metálica:</label><span>${p.liga}</span></div>
  <div class="kv"><label>Peso Bruto:</label><span>${p.bruto}</span></div>
  <div class="kv"><label>Peso Líquido:</label><span>${p.liquido}</span></div>
 </div>
 <div class="menu">
  <button onclick="icfs()"><span class="ico">☷</span><div><b>ICFS</b><small>Visualize as ICFIs vinculadas a esta peça</small></div><span class="arrow">›</span></button>
  <button onclick="photos()"><span class="ico">▣</span><div><b>Fotos da peça</b><small>Acesse a pasta de fotos desta peça</small></div><span class="arrow">›</span></button>
  <button onclick="drawing()"><span class="ico">◇</span><div><b>Desenho 3D</b><small>Visualize o modelo 3D da peça</small></div><span class="arrow">›</span></button>
  <button onclick="painting()"><span class="ico">◉</span><div><b>Informações Pintura</b><small>Acesse as informações de pintura da peça</small></div><span class="arrow">›</span></button>
  <button onclick="flow()"><span class="ico">⚙</span><div><b>Fluxo de produção da peça</b><small>Veja as etapas do processo de acabamento</small></div><span class="arrow">›</span></button>
  <button onclick="lifting()"><span class="ico">⚓</span><div><b>Dispositivos de elevação utilizados</b><small>Confira ganchos, lingas e cintas aplicáveis</small></div><span class="arrow">›</span></button>
 </div>`;
}
function icfs(){subPage("ICFS",`<div class="list">${current.icfs.map(x=>`<div class="row"><b>${x[0]}</b><small>${x[1]}</small></div>`).join("")}</div>`)}
function photos(){subPage("Fotos da peça",`<div class="card"><b>Pasta: ${current.chave}</b><div class="gallery" style="margin-top:14px">${current.fotos.map((x,i)=>`<div class="photo">▣<span>${x}</span></div>`).join("")}</div></div>`)}
function drawing(){subPage("Desenho 3D",`<div class="card"><div class="hero" style="height:300px;margin:0"><div class="heroText"><b>MODELO 3D</b><span>${current.chave} • visualização cadastrada</span></div></div><p style="color:var(--muted)">Nesta área será possível abrir as imagens/renderizações do desenho 3D da peça.</p></div>`)}
function painting(){subPage("Informações Pintura",`<div class="card"><div class="sectionTitle">ESPECIFICAÇÕES</div>${current.pintura.map(x=>`<div class="kv"><label>${x[0]}:</label><span>${x[1]}</span></div>`).join("")}<div class="sectionTitle">STATUS</div><span class="badge">INFORMAÇÕES CADASTRADAS</span></div>`)}
function flow(){subPage("Fluxo de produção",`<div class="flow">${current.fluxo.map((x,i)=>`<div class="step"><b>${i+1}. ${x}</b><small>${i===current.fluxo.length-1?'Etapa final':'Próxima etapa do processo'}</small></div>`).join("")}</div>`)}
function lifting(){subPage("Dispositivos de elevação",`<div class="list">${current.elevacao.map(x=>`<div class="row"><b>${x[0]} — ${x[1]}</b><small>${x[2]}</small></div>`).join("")}</div><div class="card" style="margin-top:12px"><b>⚠ Segurança</b><p style="color:var(--muted);font-size:13px">Antes do uso, confirmar identificação, capacidade, estado de conservação e configuração do dispositivo conforme procedimento aplicável.</p></div>`)}
function subPage(title,body){document.getElementById("content").innerHTML=shell(title)+body}
function goBack(){ if(current) partPage(); else home() }
function historyPage(){document.getElementById("content").innerHTML=shell("Histórico",false)+`<div class="card"><div class="empty">Nenhuma consulta registrada ainda.<br><small>O histórico poderá registrar peça, usuário, data, hora e resultado da checagem.</small></div></div>`}
function registerPage(){document.getElementById("content").innerHTML=shell("Cadastrar peça",false)+`<div class="card">
 <div class="sectionTitle">NOVA PEÇA</div>
 <input id="newkey" class="input" placeholder="Número chave"><br><br>
 <input id="newdesc" class="input" placeholder="Descrição"><br><br>
 <input id="newclient" class="input" placeholder="Cliente"><br><br>
 <button class="primary" onclick="savePart()">SALVAR PEÇA</button>
 </div><div class="card"><small style="color:var(--muted)">A versão inicial usa um cadastro local no navegador. Depois podemos ligar o aplicativo a Excel, SharePoint, banco de dados ou servidor.</small></div>`}
function savePart(){
 const k=document.getElementById("newkey").value.trim().toUpperCase();
 if(!k){showToast("Informe o número chave.");return}
 db[k]={chave:k,cliente:document.getElementById("newclient").value||"Não informado",descricao:document.getElementById("newdesc").value||"Não informado",liga:"Não informado",bruto:"Não informado",liquido:"Não informado",icfs:[],fotos:[],pintura:[],fluxo:[],elevacao:[]};
 showToast("Peça cadastrada com sucesso.");setTimeout(()=>home(),700)
}
function showToast(t){const old=document.querySelector(".toast");if(old)old.remove();const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
home();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js")); }
</script>
</body>
</html>
